<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Trend Mind</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #1a73e8; }
        .bar { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; }
        select { padding: 9px 10px; border: 1px solid #ccd; border-radius: 5px; font-family: inherit; }
        #msg { margin-top: 12px; color: #0a7d36; min-height: 20px; font-size: 14px; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; }
        .card { position: relative; background: white; width: 280px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 15px; text-align: right; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
        .card h3 { font-size: 14px; margin: 10px 0; color: #333; }
        .card p { font-size: 12px; color: #666; margin: 5px 0; }
        .card a { display: block; text-align: center; background: #1a73e8; color: white; text-decoration: none; padding: 8px; border-radius: 4px; margin-top: 10px; }
        .badge { position: absolute; top: 22px; right: 22px; background: #e8710a; color: white; font-size: 12px; padding: 3px 9px; border-radius: 12px; }
        .regions { color: #0f766e; font-weight: bold; }
        button { padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        button:disabled { opacity: .6; cursor: wait; }
        button.tt { background: #111; }
        input[type=text] { padding: 9px 10px; border: 1px solid #ccd; border-radius: 5px; font-family: inherit; width: 220px; }
        .row { margin-top: 12px; }
        .plat { display: inline-block; font-size: 12px; background: #eef; color: #335; padding: 2px 8px; border-radius: 10px; }
    </style>
</head>
<body>

    <h1>Trend Mind 🚀</h1>
    <p>لوحة تحكم الترندات الذكية</p>

    <div class="bar">
        <button id="btn" onclick="refreshTrends()">🔄 تحديث وعرض الترندات</button>

        <select id="scope" title="نطاق الجلب">
            <option value="me">جلب: الشرق الأوسط</option>
            <option value="world">جلب: العالم كله</option>
        </select>

        <select id="region" onchange="loadTrends()" title="عرض دولة معينة">
            <option value="">عرض: كل الدول</option>
            <option value="SA">السعودية</option>
            <option value="YE">اليمن</option>
            <option value="EG">مصر</option>
            <option value="AE">الإمارات</option>
            <option value="JO">الأردن</option>
            <option value="LB">لبنان</option>
            <option value="IQ">العراق</option>
            <option value="KW">الكويت</option>
            <option value="QA">قطر</option>
            <option value="BH">البحرين</option>
            <option value="OM">عمان</option>
            <option value="PS">فلسطين</option>
            <option value="LY">ليبيا</option>
            <option value="SD">السودان</option>
            <option value="MA">المغرب</option>
            <option value="DZ">الجزائر</option>
            <option value="TN">تونس</option>
            <option value="TR">تركيا</option>
            <option value="US">أمريكا</option>
            <option value="GB">بريطانيا</option>
        </select>

        <select id="sort" onchange="loadTrends()" title="الترتيب">
            <option value="score">الأعلى نقاطاً</option>
            <option value="spread">الأكثر انتشاراً بين الدول</option>
            <option value="new">الأحدث إضافة</option>
        </select>
    </div>
    <div class="bar row">
        <input type="text" id="tags" value="fyp" placeholder="هاشتاقات مفصولة بفاصلة: fyp, تقنية">
        <button class="tt" id="ttbtn" onclick="refreshTikTok()">🎵 جلب تيك توك</button>
        <select id="platform" onchange="loadTrends()" title="المنصة">
            <option value="">كل المنصات</option>
            <option value="youtube">يوتيوب فقط</option>
            <option value="tiktok">تيك توك فقط</option>
        </select>
    </div>
    <div id="msg"></div>

    <div class="grid" id="container">
        <p style="margin-top:20px; color:#666;">جاري التحميل...</p>
    </div>

    <script>
        const API = 'http://127.0.0.1:8000';

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g,
                c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function refreshTrends() {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');
            const scope = document.getElementById('scope').value;
            btn.disabled = true;
            msg.style.color = '#666';
            msg.textContent = scope === 'world'
                ? 'جاري الجلب من العالم كله (قد يستغرق نحو نصف دقيقة)...'
                : 'جاري الجلب من دول الشرق الأوسط...';
            try {
                const res = await fetch(API + '/collect-now?scope=' + scope, { method: 'POST' });
                if (!res.ok) throw new Error('رد السيرفر: ' + res.status);
                const r = await res.json();
                await loadTrends();
                msg.style.color = '#0a7d36';
                msg.textContent = r.added > 0
                    ? 'تمت إضافة ' + r.added + ' ترند جديد من ' + r.countries + ' دولة.'
                    : 'لا توجد ترندات جديدة الآن (يوتيوب يغيّر القائمة كل ساعات). تم تحديث الأرقام فقط.';
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = 'تعذر التحديث: ' + err.message + ' (تأكدي أن uvicorn يعمل)';
            } finally {
                btn.disabled = false;
            }
        }

        async function refreshTikTok() {
            const btn = document.getElementById('ttbtn');
            const msg = document.getElementById('msg');
            const tags = document.getElementById('tags').value;
            btn.disabled = true;
            msg.style.color = '#666';
            msg.textContent = 'جاري الجلب من تيك توك عبر Apify (قد يستغرق دقيقة)...';
            try {
                const res = await fetch(API + '/collect-tiktok?per_tag=10&tags=' + encodeURIComponent(tags), { method: 'POST' });
                const r = await res.json();
                if (!res.ok) throw new Error(r.detail || ('رد السيرفر: ' + res.status));
                document.getElementById('platform').value = 'tiktok';
                await loadTrends();
                msg.style.color = '#0a7d36';
                msg.textContent = r.added > 0
                    ? 'تمت إضافة ' + r.added + ' فيديو من تيك توك (هاشتاقات: ' + r.tags.join('، ') + ').'
                    : 'لا توجد فيديوهات جديدة لهذه الهاشتاقات.';
            } catch (err) {
                msg.style.color = 'red';
                msg.textContent = 'تعذر الجلب من تيك توك: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        }

        async function loadTrends() {
            const container = document.getElementById('container');
            try {
                const sort = document.getElementById('sort').value;
                const region = document.getElementById('region').value;
                const platform = document.getElementById('platform').value;
                const res = await fetch(API + '/trends?limit=100&sort=' + sort + '&region=' + region + '&platform=' + platform);
                if (!res.ok) throw new Error('رد السيرفر: ' + res.status);
                const data = await res.json();

                if (data.length === 0) {
                    container.innerHTML = '<p>لا توجد ترندات لهذا الاختيار. اضغطي تحديث.</p>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    const isNew = (Date.now() - new Date(item.first_seen)) < 60 * 60 * 1000;
                    const regs = (item.regions || '').split(',').filter(Boolean);
                    html += `
                        <div class="card">
                            ${isNew ? '<span class="badge">جديد</span>' : ''}
                            <img src="${esc(item.image_url)}" alt="img">
                            <h3>${esc(item.title)}</h3>
                            <p><span class="plat">${item.platform === 'tiktok' ? '🎵 تيك توك' : '▶️ يوتيوب'}</span>
                               ${item.platform === 'tiktok' ? 'الحساب' : 'القناة'}: ${esc(item.owner)}</p>
                            <p>👁 المشاهدات: ${item.views.toLocaleString()}</p>
                            <p>⭐️ النقاط: ${item.score}</p>
                            ${regs.length ? `<p>🌍 رائج في <span class="regions">${regs.length}</span> دولة: ${esc(regs.join(' ، '))}</p>` : ''}
                            <a href="${esc(item.url)}" target="_blank">مشاهدة الفيديو</a>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p style="color:red;">تعذر الاتصال بالسيرفر: ' + esc(err.message) +
                    '<br>تأكدي أن uvicorn يعمل في التيرمنال.</p>';
            }
        }

        loadTrends();
    </script>
</body>
</html>
